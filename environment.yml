# VieSpeaker2 conda environment (Linux + CUDA / A100).
#
# Create with:
#     conda env create -f environment.yml
#     conda activate VieSpeaker2
#
# The heavy Python deps (incl. CUDA torch) are installed via pip from
# requirements.txt. conda only provides the interpreter + ffmpeg + git-lfs.
name: VieSpeaker2
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - ffmpeg            # required by Pipeline 2 (audio/video extraction)
  - git-lfs           # some model weights are LFS objects
  - pip:
      - -r requirements.txt
